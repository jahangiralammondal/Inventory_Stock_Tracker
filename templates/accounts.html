{% extends 'base.html' %}{% from 'macros.html' import csrf with context %}{% block body %}<form method="post" class="card fields">{{ csrf() }}<label>Name or organisation<input name="name" required maxlength="100"></label><label>Role<select name="role">{% for r in roles %}<option>{{ r }}</option>{% endfor %}</select></label><label>Username<input name="username" required maxlength="80"></label><label>Initial password<input name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required></label><div class="wide"><button>Create account</button></div></form><h2>Directory</h2><div class="scroll"><table><tr><th>Name</th><th>Username</th><th>Role</th></tr>{% for u in users %}<tr><td>{{ u.name }}</td><td>{{ u.username }}</td><td>{{ u.role }}</td></tr>{% endfor %}</table></div>{% endblock %}
